<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap');

  *{box-sizing:border-box;}
  #fc-root{
    --paper:#EAE6D9;
    --card:#FBF8F0;
    --ink:#2A2721;
    --ink-soft:#736C5C;
    --line:#D6D0BE;
    --accent:#4A6670;
    --accent-ink:#F4F1E8;
    --danger:#8C4A3E;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:14px 12px calc(28px + env(safe-area-inset-bottom));
    max-width:400px;
    margin:0 auto;
    -webkit-tap-highlight-color:transparent;
  }
  .fc-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .fc-title{font-family:'Fraunces',serif;font-size:21px;font-weight:600;letter-spacing:-0.01em;}
  .fc-count{font-size:12px;color:var(--ink-soft);}

  .fc-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .fc-tabs::-webkit-scrollbar{display:none;}
  .fc-tab{flex:0 0 auto;padding:11px 14px 9px;min-height:22px;background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--tab-color,var(--line));border-radius:8px 8px 0 0;font-size:14px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .fc-tab.active{color:var(--ink);font-weight:600;background:#fff;}
  .fc-tab-add{flex:0 0 auto;padding:11px 14px 9px;background:transparent;border:1px dashed var(--line);border-radius:8px 8px 0 0;font-size:14px;color:var(--ink-soft);cursor:pointer;}

  .fc-cat-manage{font-size:12px;color:var(--ink-soft);text-decoration:underline;background:none;border:none;padding:0;cursor:pointer;}
  .fc-subrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:6px;}
  .fc-status-row{display:flex;align-items:center;gap:12px;}
  .fc-status{font-size:11px;color:var(--ink-soft);}
  .fc-status.error, .fc-status.unsupported{color:var(--danger);font-weight:600;}
  .fc-warn{background:#F3E3DE;border:1px solid var(--danger);color:var(--danger);font-size:12px;padding:9px 12px;border-radius:6px;margin-bottom:12px;line-height:1.6;}
  .fc-backup-textarea{width:100%;min-height:130px;font-size:12px;font-family:monospace;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);resize:vertical;}
  .fc-backup-section{margin-bottom:18px;}
  .fc-backup-section h4{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;margin:0 0 6px;}

  .fc-crumb{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .fc-crumb-back{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 14px;min-height:20px;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .fc-crumb-text{font-size:13px;color:var(--ink-soft);}
  .fc-crumb-text b{color:var(--ink);font-weight:600;}

  .fc-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  .fc-toolbar .left{font-size:13px;color:var(--ink-soft);}
  .fc-study-btn{background:var(--accent);color:var(--accent-ink);border:none;padding:11px 16px;min-height:20px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .fc-study-btn:disabled{opacity:0.4;}

  .fc-list{display:flex;flex-direction:column;gap:9px;margin-bottom:12px;}

  .fc-node{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 14px 13px 20px;overflow:hidden;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:24px;}
  .fc-node::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--item-color,var(--accent));opacity:0.5;}
  .fc-node-name{font-family:'Fraunces',serif;font-size:16px;}
  .fc-node-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .fc-node-chevron{color:var(--ink-soft);font-size:17px;flex:0 0 auto;padding:6px;}
  .fc-node-actions{position:absolute;top:6px;right:8px;display:flex;gap:4px;}
  .fc-node-actions button{background:none;border:none;font-size:11px;color:var(--ink-soft);text-decoration:underline;padding:8px 6px;cursor:pointer;}

  .fc-item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 14px 13px 20px;overflow:hidden;}
  .fc-item::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--item-color,var(--accent));opacity:0.5;}
  .fc-item-front{font-family:'Fraunces',serif;font-size:16px;margin-bottom:4px;}
  .fc-item-back{font-size:13px;color:var(--ink-soft);}
  .fc-item-actions{display:flex;gap:6px;margin-top:6px;margin-left:-6px;}
  .fc-item-actions button{background:none;border:none;font-size:12px;color:var(--ink-soft);text-decoration:underline;padding:8px 6px;cursor:pointer;}
  .fc-confirm-row{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12px;color:var(--danger);flex-wrap:wrap;}
  .fc-confirm-row button{border:none;background:none;text-decoration:underline;cursor:pointer;font-size:12px;padding:8px 4px;}
  .fc-confirm-row .yes{color:var(--danger);font-weight:600;}
  .fc-confirm-row .no{color:var(--ink-soft);}

  .fc-empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 10px;border:1px dashed var(--line);border-radius:8px;}

  .fc-add-row{display:flex;gap:8px;}
  .fc-add-card-btn{flex:1;padding:13px 8px;min-height:20px;background:transparent;border:1px dashed var(--line);border-radius:8px;color:var(--ink-soft);font-size:12.5px;cursor:pointer;}

  .fc-overlay{position:fixed;inset:0;background:rgba(42,39,33,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .fc-modal{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:fc-slide-up 0.2s ease-out;}
  @keyframes fc-slide-up{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .fc-modal h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 6px;}
  .fc-modal .fc-hint{font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6;}
  .fc-field{margin-bottom:12px;}
  .fc-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .fc-field input,.fc-field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
  .fc-field textarea{min-height:70px;resize:vertical;}
  .fc-field textarea.fc-bulk-area{min-height:180px;font-size:14px;line-height:1.6;}
  .fc-swatches{display:flex;gap:8px;margin-top:4px;}
  .fc-swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .fc-swatch.selected{border-color:var(--ink);}
  .fc-modal-actions{display:flex;gap:10px;margin-top:18px;}
  .fc-btn{flex:1;padding:11px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;}
  .fc-btn-primary{background:var(--accent);color:var(--accent-ink);}
  .fc-btn-secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .fc-modal-delete{margin-top:14px;text-align:center;}
  .fc-modal-delete button{background:none;border:none;color:var(--danger);font-size:12px;text-decoration:underline;cursor:pointer;}

  .fc-study{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));}
  .fc-study-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex:0 0 auto;}
  .fc-study-close{background:none;border:none;font-size:14px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;padding:8px 4px;}
  .fc-study-progress{font-size:13px;color:var(--ink-soft);}
  .fc-study-stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;perspective:1200px;padding:4px 0;}
  .fc-flashcard{width:min(320px,88vw);height:100%;max-height:420px;position:relative;cursor:pointer;}
  .fc-flashcard-inner{position:relative;width:100%;height:100%;transition:transform 0.4s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .fc-flashcard.flipped .fc-flashcard-inner{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:10px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:24px 18px 18px;text-align:center;box-shadow:0 1px 2px rgba(42,39,33,0.08);overflow-y:auto;}
  .fc-face::before{content:'';position:absolute;top:32px;left:0;right:0;height:1px;background:var(--face-color,var(--accent));opacity:0.35;}
  .fc-face-back{transform:rotateY(180deg);}
  .fc-face-text{font-family:'Fraunces',serif;font-size:19px;line-height:1.5;white-space:pre-wrap;}
  .fc-face-back .fc-face-text{font-size:15.5px;font-family:'Inter',sans-serif;color:var(--ink-soft);}
  .fc-face-label{position:absolute;top:9px;left:14px;font-size:11px;color:var(--ink-soft);}
  .fc-study-nav{display:flex;gap:10px;margin-top:14px;flex:0 0 auto;}
  .fc-nav-btn{flex:1;padding:14px 10px;min-height:22px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink);cursor:pointer;}
  .fc-nav-btn.primary{background:var(--accent);color:var(--accent-ink);border:none;}
  .fc-shuffle-row{text-align:center;margin-top:10px;flex:0 0 auto;}
  .fc-shuffle-row button{background:none;border:none;font-size:13px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:8px;}
  .fc-loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;}
</style>

<div id="fc-root"><div class="fc-loading">読み込み中…</div></div>

<script>
(function(){
  const PALETTE = ['#5C6B4E','#4A6670','#7A5C3E','#6B4A5C','#3E5C7A','#7A6A2E'];
  const root = document.getElementById('fc-root');

  // data.categories: [{id,name,color}]
  // data.headings[catId]: [{id,name}]
  // data.chapters[headId]: [{id,name}]
  // data.cards[chapId]: [{id,front,back}]
  let data = { categories: [], headings: {}, chapters: {}, cards: {} };
  let nav = { catId:null, headId:null, chapId:null };
  let modal = null;
  let pendingDelete = null; // {kind:'heading'|'chapter'|'card', id}
  let saveStatus = 'saved'; // 'saved' | 'saving' | 'error' | 'unsupported'
  let importConfirming = false;

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  async function load(){
    if(typeof window.storage === 'undefined'){
      saveStatus = 'unsupported';
    }else{
      try{
        const res = await window.storage.get('flashcards-data', false);
        if(res && res.value) data = JSON.parse(res.value);
      }catch(e){ /* 初回は何も保存されていない、またはキー未作成 */ }
    }

    if(!data.categories || !data.categories.length){
      const catId = uid(), headId = uid(), chapId = uid();
      data = {
        categories: [{id:catId, name:'サンプル', color:PALETTE[0]}],
        headings: { [catId]: [{id:headId, name:'第1部'}] },
        chapters: { [headId]: [{id:chapId, name:'第1章'}] },
        cards: { [chapId]: [{id:uid(), front:'カテゴリ→大見出し→章の順にタップして進みます', back:'章の中にカードが並びます。右下の「一括追加」で複数枚まとめて登録できます'}] }
      };
      if(saveStatus !== 'unsupported') await persist();
    }
    nav.catId = data.categories[0].id;
    render();
  }

  async function persist(){
    if(typeof window.storage === 'undefined'){ saveStatus = 'unsupported'; return false; }
    saveStatus = 'saving';
    try{
      const r = await window.storage.set('flashcards-data', JSON.stringify(data), false);
      saveStatus = r ? 'saved' : 'error';
      if(!r) console.error('保存に失敗しました');
      return !!r;
    }catch(e){
      saveStatus = 'error';
      console.error('storage error', e);
      return false;
    }
  }

  // 保存に失敗した操作を自動で1回だけ再試行する
  async function persistWithRetry(){
    const ok = await persist();
    if(!ok && saveStatus === 'error'){
      await new Promise(r=>setTimeout(r, 800));
      await persist();
    }
  }

  function cat(id){ return data.categories.find(c=>c.id===id); }
  function headingsOf(catId){ return data.headings[catId] || []; }
  function chaptersOf(headId){ return data.chapters[headId] || []; }
  function cardsOf(chapId){ return data.cards[chapId] || []; }
  function heading(id){
    for(const cid in data.headings){ const h=data.headings[cid].find(x=>x.id===id); if(h) return h; }
    return null;
  }
  function chapter(id){
    for(const hid in data.chapters){ const c=data.chapters[hid].find(x=>x.id===id); if(c) return c; }
    return null;
  }

  function cardsUnderCategory(catId){
    let out=[];
    headingsOf(catId).forEach(h=> chaptersOf(h.id).forEach(c=> out=out.concat(cardsOf(c.id)) ));
    return out;
  }
  function cardsUnderHeading(headId){
    let out=[];
    chaptersOf(headId).forEach(c=> out=out.concat(cardsOf(c.id)) );
    return out;
  }

  function nextColor(){
    const used = data.categories.map(c=>c.color);
    return PALETTE.find(c=>!used.includes(c)) || PALETTE[data.categories.length % PALETTE.length];
  }

  // ---------- render ----------
  function render(){
    if(window.__fc_study){ renderStudy(); return; }

    const activeCat = cat(nav.catId);
    let tabsHtml = data.categories.map(c=>`
      <div class="fc-tab ${c.id===nav.catId?'active':''}" style="--tab-color:${c.color}" data-cat="${c.id}">${escapeHtml(c.name)}</div>
    `).join('') + `<div class="fc-tab-add" id="fc-add-cat">＋ カテゴリ</div>`;

    let bodyHtml = '';
    if(!nav.headId){
      // ---- headings list ----
      const list = headingsOf(nav.catId);
      const studyCards = cardsUnderCategory(nav.catId);
      bodyHtml = `
        <div class="fc-toolbar">
          <div class="left">大見出し</div>
          <button class="fc-study-btn" id="fc-start-study" ${studyCards.length?'':'disabled'}>学習する(${studyCards.length})</button>
        </div>
        <div class="fc-list">
          ${list.length? list.map(h=>renderNode('heading', h, chaptersOf(h.id).length, '章', cardsUnderHeading(h.id).length, activeCat)).join('') : `<div class="fc-empty">大見出しがありません。<br>下のボタンから追加してください。</div>`}
        </div>
        <div class="fc-add-row">
          <button class="fc-add-card-btn" id="fc-add-heading">＋ 大見出しを追加</button>
          <button class="fc-add-card-btn" id="fc-bulk-add-heading">＋ 大見出しを一括追加</button>
        </div>
      `;
    }else if(nav.headId && !nav.chapId){
      // ---- chapters list ----
      const h = heading(nav.headId);
      const list = chaptersOf(nav.headId);
      const studyCards = cardsUnderHeading(nav.headId);
      bodyHtml = `
        <div class="fc-crumb">
          <button class="fc-crumb-back" id="fc-back-to-headings">‹ 戻る</button>
          <div class="fc-crumb-text"><b>${escapeHtml(h?h.name:'')}</b></div>
        </div>
        <div class="fc-toolbar">
          <div class="left">章</div>
          <button class="fc-study-btn" id="fc-start-study" ${studyCards.length?'':'disabled'}>学習する(${studyCards.length})</button>
        </div>
        <div class="fc-list">
          ${list.length? list.map(c=>renderNode('chapter', c, cardsOf(c.id).length, 'カード', cardsOf(c.id).length, activeCat)).join('') : `<div class="fc-empty">章がありません。<br>下のボタンから追加してください。</div>`}
        </div>
        <div class="fc-add-row">
          <button class="fc-add-card-btn" id="fc-add-chapter">＋ 章を追加</button>
          <button class="fc-add-card-btn" id="fc-bulk-add-chapter">＋ 章を一括追加</button>
        </div>
      `;
    }else{
      // ---- cards list ----
      const h = heading(nav.headId);
      const c = chapter(nav.chapId);
      const cards = cardsOf(nav.chapId);
      bodyHtml = `
        <div class="fc-crumb">
          <button class="fc-crumb-back" id="fc-back-to-chapters">‹ 戻る</button>
          <div class="fc-crumb-text">${escapeHtml(h?h.name:'')} ／ <b>${escapeHtml(c?c.name:'')}</b></div>
        </div>
        <div class="fc-toolbar">
          <div class="left">カード ${cards.length}枚</div>
          <button class="fc-study-btn" id="fc-start-study" ${cards.length?'':'disabled'}>学習を始める</button>
        </div>
        <div class="fc-list">
          ${cards.length? cards.map(cd=>renderCardItem(cd, activeCat)).join('') : `<div class="fc-empty">まだカードがありません。</div>`}
        </div>
        <div class="fc-add-row">
          <button class="fc-add-card-btn" id="fc-add-card">＋ 1枚追加</button>
          <button class="fc-add-card-btn" id="fc-bulk-add">＋ 一括追加</button>
        </div>
      `;
    }

    root.innerHTML = `
      <div class="fc-header">
        <div class="fc-title">フラッシュカード</div>
        <div class="fc-count">${activeCat?escapeHtml(activeCat.name):''}</div>
      </div>
      ${saveStatus==='unsupported' ? `
        <div class="fc-warn">この画面ではデータが保存されません。Claudeのチャット内で開いた状態でご利用ください。</div>
      ` : ''}
      ${saveStatus==='error' ? `
        <div class="fc-warn">保存に失敗しました。通信状態を確認し、下の「バックアップ」から手元にも保存しておくと安心です。</div>
      ` : ''}
      <div class="fc-tabs" id="fc-tabs">${tabsHtml}</div>
      <div class="fc-subrow">
        <button class="fc-cat-manage" id="fc-manage-cat">${activeCat?escapeHtml(activeCat.name):''} を編集・削除</button>
        <div class="fc-status-row">
          <span class="fc-status ${saveStatus}">${statusLabel()}</span>
          <button class="fc-cat-manage" id="fc-open-backup">バックアップ</button>
        </div>
      </div>
      ${bodyHtml}
    `;

    bindEvents();
    renderModal();
  }

  function statusLabel(){
    if(saveStatus==='saving') return '保存中…';
    if(saveStatus==='error') return '保存できません';
    if(saveStatus==='unsupported') return '保存不可';
    return '保存済み';
  }

  function renderNode(kind, item, childCount, childLabel, cardCount, activeCat){
    const confirming = pendingDelete && pendingDelete.kind===kind && pendingDelete.id===item.id;
    return `
      <div class="fc-node" data-open="${kind}:${item.id}" style="--item-color:${activeCat?activeCat.color:''}">
        <div>
          <div class="fc-node-name">${escapeHtml(item.name)}</div>
          <div class="fc-node-sub">${childLabel==='章'? childCount+'章・'+cardCount+'枚' : cardCount+'枚'}</div>
          ${confirming? `
            <div class="fc-confirm-row" onclick="event.stopPropagation()">
              本当に削除しますか？
              <button class="yes" data-confirm-del="${kind}:${item.id}">削除する</button>
              <button class="no" data-cancel-del="1">やめる</button>
            </div>
          ` : `
            <div class="fc-node-actions" onclick="event.stopPropagation()">
              <button data-rename="${kind}:${item.id}">編集</button>
              <button data-request-del="${kind}:${item.id}">削除</button>
            </div>
          `}
        </div>
        <div class="fc-node-chevron">›</div>
      </div>
    `;
  }

  function renderCardItem(cd, activeCat){
    const confirming = pendingDelete && pendingDelete.kind==='card' && pendingDelete.id===cd.id;
    return `
      <div class="fc-item" style="--item-color:${activeCat?activeCat.color:''}">
        <div class="fc-item-front">${escapeHtml(cd.front)}</div>
        <div class="fc-item-back">${escapeHtml(cd.back)}</div>
        ${confirming? `
          <div class="fc-confirm-row">
            本当に削除しますか？
            <button class="yes" data-confirm-del="card:${cd.id}">削除する</button>
            <button class="no" data-cancel-del="1">やめる</button>
          </div>
        ` : `
          <div class="fc-item-actions">
            <button data-edit-card="${cd.id}">編集</button>
            <button data-request-del="card:${cd.id}">削除</button>
          </div>
        `}
      </div>
    `;
  }

  function bindEvents(){
    document.querySelectorAll('#fc-tabs .fc-tab').forEach(el=>{
      el.addEventListener('click', ()=>{ nav = {catId:el.dataset.cat, headId:null, chapId:null}; pendingDelete=null; render(); });
    });
    const addCat = document.getElementById('fc-add-cat');
    if(addCat) addCat.addEventListener('click', ()=>{ modal = {type:'category', mode:'add', color: nextColor()}; render(); });

    const manageCat = document.getElementById('fc-manage-cat');
    if(manageCat) manageCat.addEventListener('click', ()=>{
      const c = cat(nav.catId);
      if(c) modal = {type:'category', mode:'edit', id:c.id, color:c.color};
      render();
    });

    const openBackup = document.getElementById('fc-open-backup');
    if(openBackup) openBackup.addEventListener('click', ()=>{ importConfirming=false; modal = {type:'backup'}; render(); });

    const addHeading = document.getElementById('fc-add-heading');
    if(addHeading) addHeading.addEventListener('click', ()=>{ modal = {type:'heading', mode:'add'}; render(); });

    const bulkAddHeading = document.getElementById('fc-bulk-add-heading');
    if(bulkAddHeading) bulkAddHeading.addEventListener('click', ()=>{ modal = {type:'bulk-heading'}; render(); });

    const addChapter = document.getElementById('fc-add-chapter');
    if(addChapter) addChapter.addEventListener('click', ()=>{ modal = {type:'chapter', mode:'add'}; render(); });

    const bulkAddChapter = document.getElementById('fc-bulk-add-chapter');
    if(bulkAddChapter) bulkAddChapter.addEventListener('click', ()=>{ modal = {type:'bulk-chapter'}; render(); });

    const addCard = document.getElementById('fc-add-card');
    if(addCard) addCard.addEventListener('click', ()=>{ modal = {type:'card', mode:'add'}; render(); });

    const bulkAdd = document.getElementById('fc-bulk-add');
    if(bulkAdd) bulkAdd.addEventListener('click', ()=>{ modal = {type:'bulk'}; render(); });

    const backHead = document.getElementById('fc-back-to-headings');
    if(backHead) backHead.addEventListener('click', ()=>{ nav.headId=null; nav.chapId=null; pendingDelete=null; render(); });

    const backChap = document.getElementById('fc-back-to-chapters');
    if(backChap) backChap.addEventListener('click', ()=>{ nav.chapId=null; pendingDelete=null; render(); });

    const startStudy = document.getElementById('fc-start-study');
    if(startStudy) startStudy.addEventListener('click', startStudySession);

    document.querySelectorAll('[data-open]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        if(e.target.closest('[data-rename],[data-request-del],[data-confirm-del],[data-cancel-del]')) return;
        const [kind,id] = el.dataset.open.split(':');
        pendingDelete = null;
        if(kind==='heading'){ nav.headId = id; nav.chapId = null; }
        else if(kind==='chapter'){ nav.chapId = id; }
        render();
      });
    });

    document.querySelectorAll('[data-rename]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const [kind,id] = el.dataset.rename.split(':');
        const item = kind==='heading'? heading(id) : chapter(id);
        modal = {type:kind, mode:'edit', id, name:item?item.name:''};
        render();
      });
    });
    document.querySelectorAll('[data-request-del]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const [kind,id] = el.dataset.requestDel.split(':');
        pendingDelete = {kind, id};
        render();
      });
    });
    document.querySelectorAll('[data-confirm-del]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const [kind,id] = el.dataset.confirmDel.split(':');
        await performDelete(kind, id);
      });
    });
    document.querySelectorAll('[data-cancel-del]').forEach(el=>{
      el.addEventListener('click', ()=>{ pendingDelete=null; render(); });
    });
    document.querySelectorAll('[data-edit-card]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const cd = cardsOf(nav.chapId).find(c=>c.id===el.dataset.editCard);
        modal = {type:'card', mode:'edit', id:el.dataset.editCard, front:cd.front, back:cd.back};
        render();
      });
    });
  }

  async function performDelete(kind, id){
    if(kind==='card'){
      data.cards[nav.chapId] = cardsOf(nav.chapId).filter(c=>c.id!==id);
    }else if(kind==='chapter'){
      const hid = nav.headId;
      data.chapters[hid] = chaptersOf(hid).filter(c=>c.id!==id);
      delete data.cards[id];
      if(nav.chapId===id) nav.chapId=null;
    }else if(kind==='heading'){
      const cidCat = nav.catId;
      data.headings[cidCat] = headingsOf(cidCat).filter(h=>h.id!==id);
      chaptersOf(id).forEach(ch=> delete data.cards[ch.id]);
      delete data.chapters[id];
      if(nav.headId===id){ nav.headId=null; nav.chapId=null; }
    }
    pendingDelete = null;
    await persistWithRetry();
    render();
  }

  // ---------- modal ----------
  function renderModal(){
    let overlay = document.getElementById('fc-overlay');
    if(overlay) overlay.remove();
    if(!modal) return;

    const wrap = document.createElement('div');
    wrap.className = 'fc-overlay';
    wrap.id = 'fc-overlay';

    if(modal.type === 'backup'){
      const json = JSON.stringify(data, null, 2);
      wrap.innerHTML = `
        <div class="fc-modal">
          <h3>データのバックアップ</h3>
          <div class="fc-backup-section">
            <h4>書き出し</h4>
            <div class="fc-hint">下の内容を全選択してコピーし、メモアプリなどに保存しておくと、万一の際も復元できます。</div>
            <textarea class="fc-backup-textarea" id="fc-backup-export" readonly>${escapeHtml(json)}</textarea>
            <div class="fc-modal-actions">
              <button class="fc-btn fc-btn-secondary" id="fc-backup-copy">全選択してコピー</button>
            </div>
          </div>
          <div class="fc-backup-section">
            <h4>読み込み</h4>
            <div class="fc-hint">保存しておいたバックアップを貼り付けると、今のデータを置き換えます。</div>
            <textarea class="fc-backup-textarea" id="fc-backup-import" placeholder="ここにバックアップのJSONを貼り付け"></textarea>
            ${importConfirming ? `
              <div class="fc-confirm-row">
                今のデータは全て上書きされます。よろしいですか？
                <button class="yes" id="fc-backup-import-confirm">上書きする</button>
                <button class="no" id="fc-backup-import-cancel">やめる</button>
              </div>
            ` : `
              <div class="fc-modal-actions">
                <button class="fc-btn fc-btn-secondary" id="fc-backup-import-btn">このデータで上書きする</button>
              </div>
            `}
          </div>
          <div class="fc-modal-actions">
            <button class="fc-btn fc-btn-primary" id="fc-cancel">閉じる</button>
          </div>
        </div>
      `;
    }else if(modal.type === 'category'){
      const editing = modal.mode==='edit';
      const c = editing ? cat(modal.id) : null;
      wrap.innerHTML = `
        <div class="fc-modal">
          <h3>${editing?'カテゴリを編集':'新しいカテゴリ'}</h3>
          <div class="fc-field">
            <label>カテゴリ名</label>
            <input type="text" id="fc-cat-name" placeholder="例：危険物乙4" value="${editing?escapeHtml(c.name):''}">
          </div>
          <div class="fc-field">
            <label>色</label>
            <div class="fc-swatches" id="fc-swatches">
              ${PALETTE.map(col=>`<div class="fc-swatch ${col===modal.color?'selected':''}" style="background:${col}" data-color="${col}"></div>`).join('')}
            </div>
          </div>
          <div class="fc-modal-actions">
            <button class="fc-btn fc-btn-secondary" id="fc-cancel">キャンセル</button>
            <button class="fc-btn fc-btn-primary" id="fc-save-cat">${editing?'保存':'追加'}</button>
          </div>
          ${editing && data.categories.length>1 ? `<div class="fc-modal-delete"><button id="fc-del-cat">このカテゴリを削除(中身も全て削除されます)</button></div>` : ''}
        </div>
      `;
    }else if(modal.type === 'heading' || modal.type === 'chapter'){
      const editing = modal.mode==='edit';
      const label = modal.type==='heading' ? '大見出し' : '章';
      wrap.innerHTML = `
        <div class="fc-modal">
          <h3>${editing? label+'を編集' : '新しい'+label}</h3>
          <div class="fc-field">
            <label>${label}名</label>
            <input type="text" id="fc-node-name" placeholder="例：${modal.type==='heading'?'第1部 総則':'第1章 基礎知識'}" value="${editing?escapeHtml(modal.name):''}">
          </div>
          <div class="fc-modal-actions">
            <button class="fc-btn fc-btn-secondary" id="fc-cancel">キャンセル</button>
            <button class="fc-btn fc-btn-primary" id="fc-save-node">${editing?'保存':'追加'}</button>
          </div>
        </div>
      `;
    }else if(modal.type === 'card'){
      const editing = modal.mode==='edit';
      wrap.innerHTML = `
        <div class="fc-modal">
          <h3>${editing?'カードを編集':'新しいカード'}</h3>
          <div class="fc-field">
            <label>表面(問題)</label>
            <textarea id="fc-card-front">${editing?escapeHtml(modal.front):''}</textarea>
          </div>
          <div class="fc-field">
            <label>裏面(答え)</label>
            <textarea id="fc-card-back">${editing?escapeHtml(modal.back):''}</textarea>
          </div>
          <div class="fc-modal-actions">
            <button class="fc-btn fc-btn-secondary" id="fc-cancel">キャンセル</button>
            <button class="fc-btn fc-btn-primary" id="fc-save-card">${editing?'保存':'追加'}</button>
          </div>
        </div>
      `;
    }else if(modal.type === 'bulk-heading'){
      wrap.innerHTML = `
        <div class="fc-modal">
          <h3>大見出しを一括追加</h3>
          <div class="fc-hint">
            1行に1つ、大見出しの名前を入力してください。<br>
            例）第1部 総則
          </div>
          <div class="fc-field">
            <textarea id="fc-bulk-heading-text" class="fc-bulk-area" placeholder="第1部 総則
第2部 物理・化学
第3部 法令"></textarea>
          </div>
          <div class="fc-modal-actions">
            <button class="fc-btn fc-btn-secondary" id="fc-cancel">キャンセル</button>
            <button class="fc-btn fc-btn-primary" id="fc-save-bulk-heading">まとめて追加</button>
          </div>
        </div>
      `;
    }else if(modal.type === 'bulk-chapter'){
      wrap.innerHTML = `
        <div class="fc-modal">
          <h3>章を一括追加</h3>
          <div class="fc-hint">
            1行に1章、章の名前を入力してください。<br>
            例）第1章 基礎知識
          </div>
          <div class="fc-field">
            <textarea id="fc-bulk-chapter-text" class="fc-bulk-area" placeholder="第1章 基礎知識
第2章 物理・化学
第3章 法令"></textarea>
          </div>
          <div class="fc-modal-actions">
            <button class="fc-btn fc-btn-secondary" id="fc-cancel">キャンセル</button>
            <button class="fc-btn fc-btn-primary" id="fc-save-bulk-chapter">まとめて追加</button>
          </div>
        </div>
      `;
    }else if(modal.type === 'bulk'){
      wrap.innerHTML = `
        <div class="fc-modal">
          <h3>カードを一括追加</h3>
          <div class="fc-hint">
            1行に1枚、「表::裏」の形式で入力してください。<br>
            例）第一石油類とは::引火点21℃未満の石油類
          </div>
          <div class="fc-field">
            <textarea id="fc-bulk-text" class="fc-bulk-area" placeholder="表::裏
表::裏
表::裏"></textarea>
          </div>
          <div class="fc-modal-actions">
            <button class="fc-btn fc-btn-secondary" id="fc-cancel">キャンセル</button>
            <button class="fc-btn fc-btn-primary" id="fc-save-bulk">まとめて追加</button>
          </div>
        </div>
      `;
    }

    document.body.appendChild(wrap);
    document.getElementById('fc-cancel').addEventListener('click', ()=>{ modal=null; render(); });
    wrap.addEventListener('click', (e)=>{ if(e.target===wrap){ modal=null; render(); } });

    if(modal.type === 'backup'){
      document.getElementById('fc-backup-copy').addEventListener('click', ()=>{
        const ta = document.getElementById('fc-backup-export');
        ta.focus(); ta.select();
        try{ navigator.clipboard && navigator.clipboard.writeText(ta.value); }catch(e){}
        try{ document.execCommand('copy'); }catch(e){}
      });
      const importBtn = document.getElementById('fc-backup-import-btn');
      if(importBtn) importBtn.addEventListener('click', ()=>{
        const text = document.getElementById('fc-backup-import').value.trim();
        if(!text) return;
        importConfirming = true;
        renderModal();
      });
      const confirmBtn = document.getElementById('fc-backup-import-confirm');
      if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
        const text = document.getElementById('fc-backup-import').value.trim();
        try{
          const parsed = JSON.parse(text);
          if(!parsed.categories) throw new Error('invalid');
          data = { categories: parsed.categories||[], headings: parsed.headings||{}, chapters: parsed.chapters||{}, cards: parsed.cards||{} };
          nav = { catId: data.categories[0]? data.categories[0].id : null, headId:null, chapId:null };
          importConfirming = false;
          modal = null;
          await persistWithRetry();
          render();
        }catch(e){
          const hint = document.querySelector('#fc-backup-import').previousElementSibling;
          if(hint) hint.textContent = '読み込めませんでした。正しいバックアップの内容か確認してください。';
          importConfirming = false;
          renderModal();
        }
      });
      const cancelBtn = document.getElementById('fc-backup-import-cancel');
      if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ importConfirming=false; renderModal(); });
    }else if(modal.type === 'category'){
      document.querySelectorAll('#fc-swatches .fc-swatch').forEach(el=>{
        el.addEventListener('click', ()=>{ modal.color = el.dataset.color; renderModal(); });
      });
      document.getElementById('fc-save-cat').addEventListener('click', saveCategory);
      const delBtn = document.getElementById('fc-del-cat');
      if(delBtn) delBtn.addEventListener('click', deleteCategory);
      document.getElementById('fc-cat-name').focus();
    }else if(modal.type === 'heading' || modal.type === 'chapter'){
      document.getElementById('fc-save-node').addEventListener('click', saveNode);
      document.getElementById('fc-node-name').focus();
    }else if(modal.type === 'card'){
      document.getElementById('fc-save-card').addEventListener('click', saveCard);
      document.getElementById('fc-card-front').focus();
    }else if(modal.type === 'bulk'){
      document.getElementById('fc-save-bulk').addEventListener('click', saveBulk);
      document.getElementById('fc-bulk-text').focus();
    }else if(modal.type === 'bulk-chapter'){
      document.getElementById('fc-save-bulk-chapter').addEventListener('click', saveBulkChapter);
      document.getElementById('fc-bulk-chapter-text').focus();
    }else if(modal.type === 'bulk-heading'){
      document.getElementById('fc-save-bulk-heading').addEventListener('click', saveBulkHeading);
      document.getElementById('fc-bulk-heading-text').focus();
    }
  }

  async function saveCategory(){
    const name = document.getElementById('fc-cat-name').value.trim();
    if(!name) return;
    if(modal.mode==='edit'){
      const c = cat(modal.id);
      c.name = name; c.color = modal.color;
    }else{
      const id = uid();
      data.categories.push({id, name, color:modal.color});
      data.headings[id] = [];
      nav = {catId:id, headId:null, chapId:null};
    }
    modal = null;
    await persistWithRetry();
    render();
  }
  async function deleteCategory(){
    const id = modal.id;
    headingsOf(id).forEach(h=>{
      chaptersOf(h.id).forEach(c=> delete data.cards[c.id]);
      delete data.chapters[h.id];
    });
    delete data.headings[id];
    data.categories = data.categories.filter(c=>c.id!==id);
    if(nav.catId===id) nav = {catId:data.categories[0].id, headId:null, chapId:null};
    modal = null;
    await persistWithRetry();
    render();
  }

  async function saveNode(){
    const name = document.getElementById('fc-node-name').value.trim();
    if(!name) return;
    if(modal.type==='heading'){
      if(modal.mode==='edit'){ heading(modal.id).name = name; }
      else{
        const id = uid();
        data.headings[nav.catId].push({id, name});
        data.chapters[id] = [];
      }
    }else{
      if(modal.mode==='edit'){ chapter(modal.id).name = name; }
      else{
        const id = uid();
        data.chapters[nav.headId].push({id, name});
        data.cards[id] = [];
      }
    }
    modal = null;
    await persistWithRetry();
    render();
  }

  async function saveBulkHeading(){
    const raw = document.getElementById('fc-bulk-heading-text').value;
    const lines = raw.split('\n');
    const added = [];
    lines.forEach(line=>{
      const name = line.trim();
      if(!name) return;
      const id = uid();
      added.push({id, name});
      data.chapters[id] = [];
    });
    if(added.length){
      data.headings[nav.catId] = headingsOf(nav.catId).concat(added);
      await persistWithRetry();
    }
    modal = null;
    render();
  }

  async function saveBulkChapter(){
    const raw = document.getElementById('fc-bulk-chapter-text').value;
    const lines = raw.split('\n');
    const added = [];
    lines.forEach(line=>{
      const name = line.trim();
      if(!name) return;
      const id = uid();
      added.push({id, name});
      data.cards[id] = [];
    });
    if(added.length){
      data.chapters[nav.headId] = chaptersOf(nav.headId).concat(added);
      await persistWithRetry();
    }
    modal = null;
    render();
  }

  async function saveCard(){
    const front = document.getElementById('fc-card-front').value.trim();
    const back = document.getElementById('fc-card-back').value.trim();
    if(!front || !back) return;
    if(modal.mode==='edit'){
      const cd = cardsOf(nav.chapId).find(c=>c.id===modal.id);
      cd.front = front; cd.back = back;
    }else{
      data.cards[nav.chapId].push({id:uid(), front, back});
    }
    modal = null;
    await persistWithRetry();
    render();
  }

  async function saveBulk(){
    const raw = document.getElementById('fc-bulk-text').value;
    const lines = raw.split('\n');
    const added = [];
    lines.forEach(line=>{
      const t = line.trim();
      if(!t) return;
      const idx = t.indexOf('::');
      if(idx === -1) return;
      const front = t.slice(0, idx).trim();
      const back = t.slice(idx+2).trim();
      if(front && back) added.push({id:uid(), front, back});
    });
    if(added.length){
      data.cards[nav.chapId] = cardsOf(nav.chapId).concat(added);
      await persistWithRetry();
    }
    modal = null;
    render();
  }

  // ---------- study mode ----------
  function startStudySession(){
    let pool;
    if(nav.chapId) pool = cardsOf(nav.chapId);
    else if(nav.headId) pool = cardsUnderHeading(nav.headId);
    else pool = cardsUnderCategory(nav.catId);
    window.__fc_study = { order: pool.map(c=>c.id), pool, index:0, flipped:false };
    render();
  }
  function studyCardById(id){ return window.__fc_study.pool.find(c=>c.id===id); }
  function shuffleStudy(){
    const s = window.__fc_study;
    const arr = s.order.slice();
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    s.order = arr; s.index = 0; s.flipped=false;
    render();
  }
  function studyNext(){ const s=window.__fc_study; if(s.index < s.order.length-1){ s.index++; s.flipped=false; render(); } }
  function studyPrev(){ const s=window.__fc_study; if(s.index > 0){ s.index--; s.flipped=false; render(); } }
  function closeStudy(){ window.__fc_study = null; pendingDelete=null; render(); }

  function renderStudy(){
    const activeCat = cat(nav.catId);
    const s = window.__fc_study;
    const cd = studyCardById(s.order[s.index]);
    if(!cd){ window.__fc_study=null; render(); return; }

    root.innerHTML = `
      <div class="fc-study">
        <div class="fc-study-top">
          <button class="fc-study-close" id="fc-study-close">閉じる</button>
          <div class="fc-study-progress">${s.index+1} / ${s.order.length}</div>
        </div>
        <div class="fc-study-stage">
          <div class="fc-flashcard ${s.flipped?'flipped':''}" id="fc-flashcard">
            <div class="fc-flashcard-inner">
              <div class="fc-face" style="--face-color:${activeCat?activeCat.color:''}">
                <div class="fc-face-label">表</div>
                <div class="fc-face-text">${escapeHtml(cd.front)}</div>
              </div>
              <div class="fc-face fc-face-back" style="--face-color:${activeCat?activeCat.color:''}">
                <div class="fc-face-label">裏</div>
                <div class="fc-face-text">${escapeHtml(cd.back)}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="fc-study-nav">
          <button class="fc-nav-btn" id="fc-prev" ${s.index===0?'disabled':''}>前へ</button>
          <button class="fc-nav-btn primary" id="fc-next" ${s.index===s.order.length-1?'disabled':''}>次へ</button>
        </div>
        <div class="fc-shuffle-row"><button id="fc-shuffle">シャッフルする</button></div>
      </div>
    `;
    document.getElementById('fc-study-close').addEventListener('click', closeStudy);
    document.getElementById('fc-flashcard').addEventListener('click', ()=>{ s.flipped = !s.flipped; render(); });
    document.getElementById('fc-prev').addEventListener('click', studyPrev);
    document.getElementById('fc-next').addEventListener('click', studyNext);
    document.getElementById('fc-shuffle').addEventListener('click', shuffleStudy);
  }

  load();
})();
</script>
